name: Falkenwarte Release
on:
  workflow_run:
    workflows: ['Falkenwarte QA']
    types: [completed]
    branches: [main]

permissions: {}
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions: {contents: write, issues: write, pull-requests: write, actions: write}
    outputs:
      created: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - name: Verify the tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$VERIFIED_SHA"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - name: Dispatch QA for the exact release PR revision
        if: steps.please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.please.outputs.pr }}
        run: |
          number="$(jq -er '.number' <<< "$RELEASE_PR")"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
          branch="$(jq -er '.head.ref' <<< "$pr")"
          sha="$(jq -er '.head.sha' <<< "$pr")"
          gh workflow run quality.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f expected_sha="$sha"

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: write, packages: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: app-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Retrieve the browser observations for this release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: acceptance
          path: acceptance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the tested image and release digest
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$VERIFIED_SHA"
          docker load -i app-image.tar.gz
          test "$(cat image.id)" = "$(docker image inspect falkenwarte:qa --format '{{.Id}}')"
          test "$(docker image inspect falkenwarte:qa --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$VERIFIED_SHA"
          jq -e --arg sha "$VERIFIED_SHA" --arg image "$(cat image.id)" '.commit == $sha and .image == $image and .overall_status == "passed"' acceptance/acceptance.json >/dev/null
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag falkenwarte:qa "$image:$TAG"
          docker push "$image:$TAG"
          digest="$(docker inspect "$image:$TAG" --format '{{index .RepoDigests 0}}')"
          jq -n --arg revision "$VERIFIED_SHA" --arg tag "$TAG" --arg image "$digest" --arg id "$(cat image.id)" '{revision:$revision,tag:$tag,image:$image,image_id:$id}' > image-manifest.json
          jq -e --arg prefix "$image@sha256:" '.image | startswith($prefix)' image-manifest.json >/dev/null
          tar -czf browser-acceptance.tar.gz -C acceptance .
          gh release upload "$TAG" image-manifest.json browser-acceptance.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          cat image-manifest.json >> "$GITHUB_STEP_SUMMARY"
