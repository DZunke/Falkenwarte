name: Falkenwarte Release
on:
  workflow_run:
    workflows: ['Falkenwarte QA']
    types: [completed]
    branches: [main]

permissions: {}
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions: {contents: write, issues: write, pull-requests: write, actions: write}
    outputs:
      created: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - name: Verify the tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$VERIFIED_SHA"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - name: Dispatch QA for the exact release PR revision
        if: steps.please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.please.outputs.pr }}
        run: |
          number="$(jq -er '.number' <<< "$RELEASE_PR")"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
          branch="$(jq -er '.head.ref' <<< "$pr")"
          sha="$(jq -er '.head.sha' <<< "$pr")"
          gh workflow run quality.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f expected_sha="$sha"

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions: {contents: write, packages: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Verify the immutable QA run for this release tag
        id: verify-release-qa
        env:
          TAG: ${{ needs.release.outputs.tag }}
          DIRECT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          tag_ref="$(jq -nr --arg tag "$TAG" '$tag | @uri')"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq .sha)"
          [[ "$TAG_SHA" =~ ^[0-9a-f]{40}$ ]]

          verify_run() {
            local run_id="$1"
            local run
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")" || return 1
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$TAG_SHA" \
              --argjson run_id "$run_id" \
              '.id == $run_id
                and .repository.full_name == $repository
                and .head_repository.full_name == $repository
                and .path == ".github/workflows/quality.yml"
                and .event == "push"
                and .head_branch == "main"
                and .head_sha == $sha
                and .status == "completed"
                and .conclusion == "success"' \
              <<< "$run" >/dev/null || return 1
            local gate_jobs
            gate_jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --jq '.jobs[] | select(.name == "quality-gate" and .status == "completed" and .conclusion == "success") | .id')" || return 1
            [[ -n "$gate_jobs" ]]
          }

          VERIFIED_RUN_ID=''
          if verify_run "$DIRECT_RUN_ID"; then
            VERIFIED_RUN_ID="$DIRECT_RUN_ID"
          else
            candidate_ids="$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$TAG_SHA" \
              -f status=success \
              -F per_page=100 \
              --jq '.workflow_runs[].id')"
            while IFS= read -r candidate_id; do
              [[ -n "$candidate_id" && "$candidate_id" != "$DIRECT_RUN_ID" ]] || continue
              if verify_run "$candidate_id"; then
                VERIFIED_RUN_ID="$candidate_id"
                break
              fi
            done <<< "$candidate_ids"
          fi

          if [[ -z "$VERIFIED_RUN_ID" ]]; then
            echo "::error::No completed successful quality.yml push run on main matched release tag SHA $TAG_SHA."
            exit 1
          fi

          printf 'verified_release_qa_run_id=%s\nverified_release_qa_sha=%s\n' "$VERIFIED_RUN_ID" "$TAG_SHA"
          {
            printf 'verified_release_qa_run_id=%s\n' "$VERIFIED_RUN_ID"
            printf 'verified_release_qa_sha=%s\n' "$TAG_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: app-image
          run-id: ${{ steps.verify-release-qa.outputs.verified_release_qa_run_id }}
          github-token: ${{ github.token }}
      - name: Retrieve the browser observations for this release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: acceptance
          path: acceptance
          run-id: ${{ steps.verify-release-qa.outputs.verified_release_qa_run_id }}
          github-token: ${{ github.token }}
      - name: Publish the tested image and release digest
        env:
          VERIFIED_SHA: ${{ steps.verify-release-qa.outputs.verified_release_qa_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$VERIFIED_SHA"
          docker load -i app-image.tar.gz
          test "$(cat image.id)" = "$(docker image inspect falkenwarte:qa --format '{{.Id}}')"
          test "$(docker image inspect falkenwarte:qa --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$VERIFIED_SHA"
          test "$(docker image inspect falkenwarte:qa --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "${TAG#v}"
          jq -e --arg sha "$VERIFIED_SHA" --arg image "$(cat image.id)" '.commit == $sha and .image == $image and .overall_status == "passed"' acceptance/acceptance.json >/dev/null
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag falkenwarte:qa "$image:$TAG"
          docker push "$image:$TAG"
          digest="$(docker inspect "$image:$TAG" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$image@sha256:" 'map(select(startswith($prefix))) | unique | if length == 1 then .[0] else error("unique GHCR digest required") end')"
          jq -n --arg revision "$VERIFIED_SHA" --arg tag "$TAG" --arg image "$digest" --arg id "$(cat image.id)" '{revision:$revision,tag:$tag,image:$image,image_id:$id}' > image-manifest.json
          jq -e --arg prefix "$image@sha256:" '.image | startswith($prefix)' image-manifest.json >/dev/null
          tar -czf browser-acceptance.tar.gz -C acceptance .
          gh release upload "$TAG" image-manifest.json browser-acceptance.tar.gz software-inventory.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          cat image-manifest.json >> "$GITHUB_STEP_SUMMARY"
