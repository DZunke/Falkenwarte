name: Falkenwarte QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Immutable commit expected at the selected ref
        required: true
        type: string
      probe:
        description: Exercise failure handling of the required E2E gate
        type: choice
        default: normal
        options: [normal, fail-e2e, skip-e2e]

permissions:
  contents: read

env:
  FALKENWARTE_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  FALKENWARTE_IMAGE: falkenwarte:qa

jobs:
  commit-policy:
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.FALKENWARTE_TEST_COMMIT }}', persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa/delivery/package-lock.json
      - run: npm ci --prefix qa/delivery --ignore-scripts --no-audit
      - name: Check commit identity and Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EXPECTED: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$FALKENWARTE_TEST_COMMIT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$EXPECTED" = "$FALKENWARTE_TEST_COMMIT"
            printf 'verified_expected_sha=%s\nverified_checkout_sha=%s\n' "$EXPECTED" "$(git rev-parse HEAD)"
            PR_TITLE="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --json title,headRefOid --jq '.[] | select(.headRefOid == env.EXPECTED) | .title')"
          fi
          title="${PR_TITLE:-$(git log -1 --pretty=%s)}"
          printf '%s\n' "$title" | npm --prefix qa/delivery run title

  static-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.FALKENWARTE_TEST_COMMIT }}', persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.5', extensions: 'pdo_sqlite,sqlite3,intl,sodium,zip,pcntl', coverage: none}
      - &composer-cache-directory-step
        name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - &composer-download-cache-step
        name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make php-deps frontend-deps
      - run: make static

  docs-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.FALKENWARTE_TEST_COMMIT }}', persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.5', extensions: 'pdo_sqlite,sqlite3,intl,sodium,zip,pcntl', coverage: none}
      - *composer-cache-directory-step
      - *composer-download-cache-step
      - run: make php-deps
      - run: make docs

  background-functional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.FALKENWARTE_TEST_COMMIT }}', persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.5', extensions: 'pdo_sqlite,sqlite3,intl,sodium,zip,pcntl', coverage: none}
      - *composer-cache-directory-step
      - *composer-download-cache-step
      - run: make php-deps
      - run: make background

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.FALKENWARTE_TEST_COMMIT }}', persist-credentials: false}
      - name: Set up pinned Docker Buildx and BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.39.0
          name: falkenwarte-release
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Record and verify image builder versions
        run: |
          set -euo pipefail
          docker version | tee docker-version.txt
          docker buildx version | tee buildx-version.txt
          grep -Eq '^github.com/docker/buildx v0\.39\.0([[:space:]]|$)' buildx-version.txt
          docker buildx inspect --bootstrap falkenwarte-release | tee buildx-inspect.txt
          grep -Eq 'Driver:[[:space:]]+docker-container' buildx-inspect.txt
          grep -Eq 'BuildKit version:[[:space:]]+v0\.35\.0([[:space:]]|$)' buildx-inspect.txt
          grep -F 'moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb' buildx-inspect.txt
      - name: Prepare the canonical build context
        id: source
        run: |
          set -euo pipefail
          mkdir app-build-context
          git -c tar.umask=0022 archive --format=tar "$FALKENWARTE_TEST_COMMIT" | tar -x -C app-build-context
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build the Linux release image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: falkenwarte-release
          source: .
          files: compose.yaml
          targets: app
          provenance: false
          set: |
            app.context=./app-build-context
            app.args.SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            app.args.APP_VERSION=${{ steps.source.outputs.version }}
            app.cache-from=type=gha,scope=falkenwarte-app-amd64
            app.cache-to=type=gha,scope=falkenwarte-app-amd64,mode=max,ignore-error=true
            app.output=type=docker,name=${{ env.FALKENWARTE_IMAGE }},dest=app-image.tar,rewrite-timestamp=true
      - name: Verify the image and export its inventory
        env:
          source_date_epoch: ${{ steps.source.outputs.epoch }}
        run: |
          set -euo pipefail
          docker load --input app-image.tar
          docker image inspect "$FALKENWARTE_IMAGE" --format '{{.Id}}' | tee image.id
          docker run --rm --entrypoint php "$FALKENWARTE_IMAGE" -r '
            $expected = filter_var($argv[1] ?? null, FILTER_VALIDATE_INT);
            if (false === $expected) {
              fwrite(STDERR, "source_date_epoch is not a valid integer argument\n");
              exit(1);
            }
            $paths = ["/app/composer.lock", "/usr/share/falkenwarte/image-audit/runtime-evidence.json"];
            foreach ($paths as $path) {
              $actual = filemtime($path);
              if ($actual === false || $actual !== $expected) {
                fwrite(STDERR, sprintf("mtime assertion failed for %s: expected %d, got %s\n", $path, $expected, var_export($actual, true)));
                exit(1);
              }
              printf("source_date_epoch_assertion=%s:%d\n", $path, $actual);
            }
            $evidence = json_decode(file_get_contents($paths[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($evidence["build"]["source_date_epoch"] ?? null) !== $expected) {
              fwrite(STDERR, "runtime-evidence source_date_epoch does not match the image build argument\n");
              exit(1);
            }
          ' -- "$source_date_epoch"
          printf 'verified_image_id=%s\n' "$(cat image.id)"
          bash scripts/export-image-audit.sh "$FALKENWARTE_IMAGE" image-inventory
          jq -e --arg sha "$FALKENWARTE_TEST_COMMIT" --arg version "$(cat version.txt)" '.application.revision == $sha and .application.version == $version' image-inventory/runtime-evidence.json
          test -s image-inventory/THIRD-PARTY-NOTICES.txt
          tar -czf software-inventory.tar.gz -C image-inventory .
          gzip -1 app-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-image
          path: |
            app-image.tar.gz
            image.id
            software-inventory.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  e2e:
    needs: build
    if: inputs.probe != 'skip-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FALKENWARTE_QA_IMAGES_PREBUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.FALKENWARTE_TEST_COMMIT }}', persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: app-image}
      - name: Exercise failed E2E job
        if: inputs.probe == 'fail-e2e'
        run: exit 1
      - name: Set up the browser image builder
        id: browser-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.39.0
          use: false
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Build the browser runner and the shared mock image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: ${{ steps.browser-builder.outputs.name }}
          source: .
          files: |
            compose.yaml
            compose.test.yaml
          targets: |
            e2e
            t3-mock
          load: true
          set: |
            e2e.cache-from=type=gha,scope=falkenwarte-browser-amd64
            e2e.cache-to=type=gha,scope=falkenwarte-browser-amd64,mode=max,ignore-error=true
            t3-mock.cache-from=type=gha,scope=falkenwarte-mocks-amd64
            t3-mock.cache-to=type=gha,scope=falkenwarte-mocks-amd64,mode=max,ignore-error=true
      - name: Test the downloaded image over its public interfaces
        run: |
          docker load -i app-image.tar.gz
          test "$(cat image.id)" = "$(docker image inspect "$FALKENWARTE_IMAGE" --format '{{.Id}}')"
          FALKENWARTE_IMAGE_REF="$(cat image.id)" make e2e-run
      - name: Verify plugin removal across image upgrades
        run: |
          FALKENWARTE_IMAGE_REF="$(cat image.id)" make plugin-upgrade-run
      - name: Upload redacted acceptance observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: acceptance, path: 'var/ci-evidence/', retention-days: 7, if-no-files-found: warn}

  quality-gate:
    name: quality-gate
    if: always()
    needs: [commit-policy, static-quality, docs-quality, background-functional, build, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'length == 6 and all(.[]; .result == "success")' <<< "$RESULTS"
