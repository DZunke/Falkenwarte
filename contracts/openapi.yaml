x-product-boundary:
  external_execution: Nur die konfigurierte T3-Instanz über MCP. Provider, Modelle, Agent-Homes, Skills und Arbeitsbereiche werden in
    T3 eingerichtet.
  references: Links sind registrierte Behauptungen. Keine URL-Auflösung, Vorschau, externe Statusabfrage, Codeanalyse oder Testausführung.
  source: Der Server bestimmt manual gegenüber technical aus authentifiziertem Principal und Transport; ein Clientfeld kann die Pflichtklassifikation
    nicht umgehen.
  attention: Menschenbedarf stammt aus persistenten Gründen und aus deren erlaubter Auflösung, nicht aus einem frei entfernbaren Label.
x-intake-policy:
  technical: MCP ist immer technical, selbst bei Owner-Token. Technische API-Principals können sich nicht als manual ausgeben.
  result: needs_information/refusal/ambiguity sind fachliche Outcomes und werden als reguläre MCP structuredContent gesendet.
  consistency: Taskrevision, Taxonomie, Policy, Routingversion und manuelle Einordnung werden vor Ergebniskommit per CAS geprüft.
  question_routing: needs_information adressiert standardmäßig den ursprünglichen Melder. Ownergründe entstehen erst durch ausdrückliche
    Eskalation oder fachliche Entscheidung.
  provider: 'DecisionGateway → SymfonyAiDecisionAdapter → PlatformInterface → OpenAI POST /v1/decisions. Native Richtung Symfony AI
    PR #2956; bis zu kompatiblem Release enge geprüfte Symfony-AI-Extension. Keine Jev- oder Responses-Fallbacks.'
