  schemas:
    Id:
      type: string
      format: uuid
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
      description: Opaque Cursor; nicht selbst zusammensetzen.
    T3ThreadCursor:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      minLength: 1
      maxLength: 15
      description: Dezimale, nichtnegative T3-Threadlistenposition.
    Slug:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,62}$
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    AllowedAction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          maxLength: 100
        enabled:
          type: boolean
        reason:
          type:
          - string
          - 'null'
      required:
      - action
      - enabled
      - reason
    ActorRef:
      $ref: schemas/event-envelope.schema.json#/properties/actor
    ResourceRef:
      type: object
      additionalProperties: false
      properties:
        resource_type:
          type: string
          enum:
          - project
          - board
          - task
          - run
          - evidence
          - approval
          - connection
          - agent_profile
          - workflow
          - workflow_instance
          - trigger
          - plugin
          - export
          - backup
          - settings
          - owner
          - label
          - intake
          - classification
          - link_collection
          - decision_policy
        id:
          type: string
          maxLength: 128
        version:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri-reference
      required:
      - resource_type
      - id
      - url
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 500
      required:
      - field
      - code
      - message
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          maxLength: 100
        trace_id:
          type: string
          maxLength: 100
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          maxItems: 100
        current_version:
          type: integer
          minimum: 1
        resync_required:
          type: boolean
        resync_url:
          type: string
          format: uri-reference
      required:
      - type
      - title
      - status
      - code
      - trace_id
    ActionAccepted:
      type: object
      additionalProperties: false
      properties:
        action_id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - accepted
          - started
          - succeeded
        action_url:
          type: string
          format: uri-reference
        resource:
          anyOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        run_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - action_id
      - status
      - action_url
      - resource
      - run_id
    Action:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/AllowedAction'
          maxItems: 80
        type:
          type: string
          maxLength: 100
        status:
          type: string
          enum:
          - accepted
          - started
          - succeeded
          - failed
        actor:
          $ref: '#/components/schemas/ActorRef'
        project_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        correlation_id:
          $ref: '#/components/schemas/Id'
        causation_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        target:
          anyOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        result:
          anyOf:
          - $ref: '#/components/schemas/ResourceRef'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Problem'
          - type: 'null'
        accepted_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - version
      - created_at
      - updated_at
      - allowed_actions
      - type
      - status
      - actor
      - project_id
      - correlation_id
      - causation_id
      - target
      - result
      - error
      - accepted_at
      - started_at
      - finished_at
    Bootstrap:
      type: object
      additionalProperties: false
      properties:
        setup_required:
          type: boolean
        app_version:
          type: string
          maxLength: 80
        contract_version:
          type: string
          maxLength: 40
        login_url:
          type: string
          format: uri-reference
      required:
      - setup_required
      - app_version
      - contract_version
      - login_url
    SetupRequest:
      type: object
      additionalProperties: false
      properties:
        setup_token:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        timezone:
          type: string
          maxLength: 80
      required:
      - setup_token
      - display_name
      - password
      - timezone
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      required:
      - password
    Owner:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/AllowedAction'
          maxItems: 80
        display_name:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 80
        locale:
          type: string
          maxLength: 20
      required:
      - id
      - version
      - created_at
      - updated_at
      - allowed_actions
      - display_name
      - timezone
      - locale
    OwnerUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          maxLength: 80
        locale:
          type: string
          maxLength: 20
      required: []
      minProperties: 1
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        current_password:
          type: string
          writeOnly: true
          maxLength: 1024
        new_password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
      required:
      - current_password
      - new_password
    Session:
      type: object
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        actor:
          anyOf:
          - $ref: '#/components/schemas/ActorRef'
          - type: 'null'
        owner:
          anyOf:
          - $ref: '#/components/schemas/Owner'
          - type: 'null'
        csrf_token:
          type:
          - string
          - 'null'
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        capabilities:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 200
        project_scope:
          anyOf:
          - $ref: '#/components/schemas/ProjectScope'
          - type: 'null'
      required:
      - authenticated
      - actor
      - owner
      - csrf_token
      - expires_at
      - capabilities
      - project_scope
      description: 'Projektumfang des aktuellen Akteurs. Owner und global freigegebene technische Principals erhalten all_projects true und eine leere Projekt-ID-Liste; anonyme Sessions erhalten null.'
    ProjectScope:
      type: object
      additionalProperties: false
      properties:
        all_projects:
          type: boolean
        project_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 200
      required:
      - all_projects
      - project_ids
    UiConfig:
      type: object
      additionalProperties: false
      properties:
        icons:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                maxLength: 100
              label:
                type: string
                maxLength: 120
            required:
            - key
            - label
          maxItems: 500
        task_types:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 40
        priorities:
          type: array
          items:
            type: string
            enum:
            - low
            - normal
