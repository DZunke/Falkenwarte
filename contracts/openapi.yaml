        Referenzthread liefert nur lesbare Routingfelder;
        kein Import von Verlauf, Skills oder nicht gelieferten Optionen. Beim Projektstandard friert Falkenwarte nur das Weglassen von
        modelSelection ein; die effektive Auswahl erfolgt bei der ersten T3-Annahme. Erst eine angenommene Launch-Zuordnung verwendet
        beim Replay den gespeicherten T3-Wert. Bei einer expliziten Providerinstanz friert Falkenwarte Instanz-ID und Modell ein und
        sendet sie als modelSelection an T3. Eine Reasoning-Auswahl ist optional und gilt nur für explizite Providerinstanzen; sie wird
