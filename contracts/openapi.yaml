            - workflow_repair_limit
            - workflow_transition_required
            - workflow_entry_condition_unmet
            - workflow_profile_unavailable
            - run_permission_in_t3
            - run_failed
            - auth_required
            - reconciliation_required
            - plugin_drain_blocked
