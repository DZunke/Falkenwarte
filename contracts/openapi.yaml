openapi: 3.1.0
info:
  title: Falkenwarte JSON-HTTP API
  version: 0.2.0
  description: Laufender JSON-HTTP-Vertrag der Linux-Anwendung Falkenwarte. Eine lokale Single-User-Steuerplattform für Tickets und eine T3-Instanz.
    JSON-HTTP, keine JSON:API-Spezifikation. Kein Code-, Repository-, GitHub-/GitLab-/Jira-API-Zugriff und keine Merge-Funktion. Technischer Eingang
    wird über OpenAI Decisions klassifiziert. Fachregeln sind für HTTP und MCP identisch.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: /api/v1
security:
- browser_session: []
- technical_token: []
tags:
- name: access
- name: projects
- name: boards
- name: tasks
- name: runs
- name: evidence
- name: history
- name: agents
- name: automation
- name: metrics
- name: plugins
- name: operations
- name: live
- name: intake
- name: labels
- name: links
x-contract-status: implemented
x-write-policy:
  idempotency: Jede fachliche Mutation benötigt Idempotency-Key. Schlüssel ist pro Principal und Operation einschließlich Zielpfad eindeutig.
    Normalisierte Payload einschließlich erwarteter Version wird serverseitig gehasht; gleiche Identität mit anderem Hash ergibt 409.
    Erneute berechtigte identische Anfragen liefern dieselbe Action-/Ressourcenidentität, bevor If-Match erneut ausgewertet wird. Berechtigung
    wird bei Replay erneut geprüft.
  retention: API-Deduplizierung wird mindestens 30 Tage nach terminaler Action aufbewahrt; konkrete Aufbewahrung wird in ui_config veröffentlicht.
    Solange eine verknüpfte externe Ausführung oder ihr Ausgang ungeklärt ist, darf die Dispatch-Identität nicht ablaufen. Ein Client
    erzeugt für neue fachliche Aktionen immer neue Keys.
  concurrency: Mutationen bestehender Aggregate verlangen genau einen starken If-Match-ETag aus dem letzten GET. Fehlend 428, veraltet
    412. Wildcard und schwache Tags werden abgewiesen. Kontextgebundene Child-Commands benennen das geprüfte Parent-Aggregat in der
    Operation.
  csrf: Browser-Cookie-Mutationen verlangen X-CSRF-Token; Bearer-Clients verwenden keinen CSRF-Token. Bootstrap/Login und OAuth-Callback
    besitzen ihre eigenen Origin-, Einmal-Token- beziehungsweise state/PKCE-Prüfungen.
  payload_hash: Der Server berechnet SHA256 über kanonische fachliche Daten; Clients müssen keinen selbst behaupteten Hash mitsenden.
    Secrets werden nicht in Historie, Diagnose oder normale Idempotenz-Response-Snapshots geschrieben.
  hard_wip: Jede Taskmutation prüft in derselben Transaktion alle betroffenen aktiven Boards des Projekts anhand alter und neuer Filter-/Spaltenmitgliedschaft.
    Harte WIP-Limits können nicht durch fehlendes board_id, Listenansicht, MCP oder Änderungen an Labels, Priorität, Zuweisung und Blockade
    umgangen werden. board_id dient nur dem Rangkontext.
x-live-protocol:
  transport: Mercure
  hub_path: /.well-known/mercure
  private_updates: true
  authorization: POST /api/v1/live/authorize setzt einen HttpOnly-Subscriber-Cookie mit serverseitig begrenzten Topics. Keine Subscriber-/Publisher-JWTs
    in JSON. Browser nutzt EventSource mit Cookies.
  recovery: GET /api/v1/events ist eine JSON-Catch-up-Abfrage. Veralteter Cursor liefert 410 mit resync_required; Client lädt Snapshot-Queries
    neu.
  payload_schema_ref: schemas/ui-change.schema.json
  event_identity: UiChange.event_id ist die fachliche UUID. Mercure-ID wird vom Hub verwaltet; GET /events verwendet einen separaten
    monotonen DB-Cursor. Keine UUID-Sortierung als Replaycursor.
paths:
  /bootstrap:
    get:
      operationId: bootstrap_get
      tags:
      - access
      summary: Öffentlichen Einrichtungszustand lesen
      responses:
        '200':
          $ref: '#/components/responses/Bootstrap'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: bootstrap_get
      x-required-capabilities: []
      security: []
    post:
      operationId: owner_setup
      tags:
      - access
      summary: Einmalig Eigentümer einrichten
      description: Nur solange setup_required=true. Einmaliger lokaler Setup-Token und Origin-Prüfung. Setzt sichere Sitzung; keine
        Mehrbenutzerregistrierung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: owner_setup
      x-required-capabilities: []
      security: []
  /session:
    post:
      operationId: session_create
      tags:
      - access
      summary: Eigentümer anmelden
      description: Same-Origin-Login mit JSON; Set-Cookie HttpOnly. Rate-Limit und generische Fehlermeldung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: session_create
      x-required-capabilities: []
      security: []
    get:
      operationId: session_get
      tags:
      - access
      summary: Aktuellen Akteur und Sitzungsrechte lesen
      description: Ohne gültiges Credential authenticated=false und keine privaten Daten. Bei Cookie-Sitzung CSRF-Token für eigene Mutationen.
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: session_get
      x-required-capabilities: []
      security: []
    delete:
      operationId: session_delete
      tags:
      - access
      summary: Browser-Sitzung beenden
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: session_delete
      x-required-capabilities: []
      security:
      - browser_session: []
        csrf_token: []
      x-owner-only: true
  /owner:
    get:
      operationId: owner_get
      tags:
      - access
      summary: Eigentümer-Einstellungen lesen
      responses:
        '200':
          $ref: '#/components/responses/Owner'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: owner_get
      x-required-capabilities:
      - access.read
      security:
      - browser_session: []
      x-owner-only: true
    patch:
      operationId: owner_update
      tags:
      - access
      summary: Eigentümerprofil ändern
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Owner'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: owner_update
      x-required-capabilities:
      - access.write
      x-version-resource: path aggregate
      security:
      - browser_session: []
        csrf_token: []
      x-owner-only: true
  /owner/password:
    post:
      operationId: owner_password_change
      tags:
      - access
      summary: Eigentümer-Geheimnis ändern
      description: If-Match auf Owner. Geheimnisse werden außerhalb regulärer Command-Historie verarbeitet; bestehende Sessions nach
        dokumentierter Policy erneuern.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Problem'
      x-application-operation: owner_password_change
      x-required-capabilities:
      - access.write
      x-version-resource: owner
      security:
      - browser_session: []
        csrf_token: []
      x-owner-only: true
  /ui/config:
    get:
      operationId: ui_config_get
      tags:
      - access
      summary: UI-Katalog und erlaubte Fähigkeiten lesen
      responses:
        '200':
