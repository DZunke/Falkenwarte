        then:
          properties:
            missing_fields:
              minItems: 1
      - if:
          properties:
            outcome:
              const: needs_human_decision
          required:
          - outcome
        then:
          properties:
            human_attention:
              properties:
                required:
                  const: true
      - if:
          properties:
            outcome:
              const: accepted
          required:
          - outcome
        then:
