components:
  securitySchemes:
    browser_session:
      type: apiKey
      in: cookie
      name: falkenwarte_session
      description: HttpOnly-Eigentümersitzung. Schreibzugriffe zusätzlich mit X-CSRF-Token; standardmäßig Same-Origin und kein freies
        CORS.
    technical_token:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Widerrufbares technisches API-/MCP-Token mit Projekt- und Capability-Bindung. Kein Benutzer- oder T3-OAuth-Token;
        Ausgabe nur einmal.
    csrf_token:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Zusätzlich zur Browser-Sitzung für Mutationen. Kein Ersatz für die Sitzung; Bearer-Clients benötigen diesen Header
        nicht.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
      description: Opaque nächste Seite.
    T3ThreadCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/T3ThreadCursor'
      description: Nichtnegative Dezimaldarstellung des T3-Offsets, die unverändert aus next_cursor übernommen wird.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Höchstens 100 Einträge.
    ProjectFilter:
      name: project_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Id'
      description: Auf ein erlaubtes Projekt begrenzen.
    Query:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 300
      description: Freitextsuche; keine SQL-/Regex-Syntax.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Starker ETag des bezeichneten Aggregats. Genau eine Version; kein * und kein schwacher Tag.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 256
      description: Neue UUID pro fachlichem Command empfohlen. Derselbe Schlüssel plus unveränderter Request ergibt dieselbe Action-/Ressourcenidentität;
        andere Payload 409.
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: UTC-Start inklusiv; Fenster maximal 366 Tage.
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: UTC-Ende exklusiv.
    Grain:
      name: grain
      in: query
      required: false
      schema:
        type: string
        enum:
        - day
        - week
        - month
        - total
        default: total
      description: Zeitauflösung.
  headers:
    ETag:
      description: Starker Versions-ETag des beschriebenen Aggregats, z.B. "7".
      schema:
        type: string
    ActionId:
      description: ID der lokal ausgeführten Action. Succeeded bedeutet nicht, dass ein externer Run abgeschlossen ist.
      schema:
        $ref: '#/components/schemas/Id'
    Location:
      description: Ressourcen- oder Action-URL.
      schema:
        type: string
        format: uri-reference
    SecretCookie:
      description: Sicherer HttpOnly-Cookie; Inhalt nicht im JSON und nicht protokollieren.
      schema:
        type: string
  responses:
    Problem:
      description: Problem-Darstellung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Fachkonflikt oder Idempotenzschlüssel mit anderer Payload
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Cursor oder temporäre Ressource abgelaufen; neu synchronisieren
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match stimmt nicht mehr mit aktueller Version überein
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Erforderlicher Idempotenzschlüssel oder If-Match fehlt
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Accepted:
      description: Dauerhaft angenommene Action; referenzierte externe Arbeit kann noch ausstehen.
      headers:
        Location:
          $ref: '#/components/headers/Location'
        X-Action-Id:
          $ref: '#/components/headers/ActionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionAccepted'
    Empty:
      description: Erfolgreich, ohne JSON-Body.
    Action:
      description: Action-Darstellung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Action'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Bootstrap:
      description: Bootstrap-Darstellung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Bootstrap'
    Owner:
      description: Owner-Darstellung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Owner'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Action-Id:
          $ref: '#/components/headers/ActionId'
    Session:
      description: Session-Darstellung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SecretCookie'
        X-Action-Id:
          $ref: '#/components/headers/ActionId'
        Location:
          $ref: '#/components/headers/Location'
    UiConfig:
      description: UiConfig-Darstellung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UiConfig'
    Project:
      description: Project-Darstellung.
